        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUserKey = "";
        window.userWalletBalance = 51.00;

        document.getElementById('final-login-btn').addEventListener('click', async () => {
            let mob = document.getElementById('mob-input').value.trim();
            let pass = document.getElementById('pass-input').value.trim();
            let name = document.getElementById('name-input').value.trim();

            if(!mob || !pass || !name) {
                alert("कृपया मोबाइल नंबर, पासवर्ड और नाम सभी भरें!");
                return;
            }

            currentUserKey = mob.replace(/[^a-zA-Z0-9]/g, "_");
            const userRef = doc(db, "users", currentUserKey);
            const userSnap = await getDoc(userRef);

            if(userSnap.exists()) {
                window.userWalletBalance = userSnap.data().balance;
            } else {
                let welcomeBonus = Math.floor(Math.random() * (50 - 10 + 1)) + 10;
                window.userWalletBalance = 51.00 + welcomeBonus;
                await setDoc(userRef, {
                    identifier: mob,
                    password: pass,
                    fullName: name,
                    balance: window.userWalletBalance,
                    createdAt: new Date().toISOString()
                });
                alert(`🎉 स्वागत बोनस ₹${welcomeBonus} आपके वॉलेट में जुड़ गया है!`);
            }

            document.getElementById('header-username').innerText = name;
            document.getElementById('user-initial').innerText = name.charAt(0).toUpperCase();
            document.getElementById('wallet-balance').innerText = window.userWalletBalance.toFixed(2);

            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
        });

        window.updateWallet = function(amount) {
            window.userWalletBalance += amount;
            document.getElementById('wallet-balance').innerText = window.userWalletBalance.toFixed(2);
            if(currentUserKey) {
                updateDoc(doc(db, "users", currentUserKey), { balance: window.userWalletBalance }).catch(e => console.error(e));
            }
        }

        // Navi UPI Deposit: 8819920722@naviaxis[span_5](start_span)[span_5](end_span)

            let amt = prompt("कितना अमाउंट ऐड करना है? (मिनिमम ₹50)");

                        updateWallet(Number(amt));

        window.launchGame = function(type) {

            if(type === 'slot' || type === 'fortune') {

                    <div class="bg-black p-6 rounded-2xl flex justify-center gap-4 text-4xl mb-4 border border-yellow-500">

                    <button onclick="playSlotGame()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-400 text-slate-950 font-black py-3 rounded-xl shadow cursor-pointer">SPIN NOW (₹10)</button>
                    <p id="slot-res" class="mt-3 text-sm font-bold text-emerald-400"></p>
                `;
            } else if(type === 'ludo') {

                    <div class="bg-black p-6 rounded-2xl text-3xl font-extrabold text-green-400 mb-4 border border-red-500">

        window.playSlotGame = function() {

            updateWallet(-10);
            let symbols = ['💎', '🍒', '⭐', '🍋', '🍉'];

            let b = symbols[Math.floor(Math.random()*symbols.length)];

            document.getElementById('s3').innerText = c;

            if(a===b && b===c) {

        window.playLudoGame = function() {
            if(window.userWalletBalance < 20) { alert('बैलेंस कम है!'); return; }
            updateWallet(-20);
            let faces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            let r = Math.floor(Math.random()*6);
            document.getElementById('dice-view').innerText = faces[r];
            if(r === 5) {
                updateWallet(60);
                document.getElementById('ludo-res').innerText = `🎉 6 आया! ₹60 जीते!`;
            } else {
                document.getElementById('ludo-res').innerText = `😢 ${r+1} आया।`;
            }
        }

        window.playAviator = function() {
            if(window.userWalletBalance < 30) { alert('बैलेंस कम है!'); return; }
            updateWallet(-30);
            let btn = document.getElementById('avi-btn');
            btn.disabled = true;
            let mult = 1.00;
            let crash = (Math.random() * 5 + 1.2).toFixed(2);
            let interval = setInterval(() => {
                mult += 0.10;
                document.getElementById('aviator-mult').innerText = mult.toFixed(2) + 'x';
                if(mult >= crash) {
                    clearInterval(interval);
                    document.getElementById('avi-res').innerText = `💥 ${crash}x पर क्रैश हो गया!`;
                    document.getElementById('avi-res').className = 'mt-3 text-sm font-bold text-red-500';
