
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hom Mony - Real Casino Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .casino-gold { border: 2px solid #facc15; box-shadow: 0 0 20px rgba(250, 204, 21, 0.4); }
        .spin-wheel { transition: transform 3s cubic-bezier(0.15, 0.95, 0.15, 1); }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen pb-20 select-none">

    <!-- TOP HEADER -->
    <div class="max-w-md mx-auto p-4">
        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-2xl casino-gold mb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-r from-yellow-500 to-amber-400 flex items-center justify-center font-black text-slate-950 text-lg">
                    💎
                </div>
                <div>
                    <h1 class="text-sm font-black text-yellow-400 tracking-wider">HOM MONY PRO</h1>
                    <p class="text-[10px] text-emerald-400 font-bold">● Live & Secure</p>
                </div>
            </div>
            <div class="bg-black px-3 py-1.5 rounded-xl border border-yellow-500/50 flex items-center gap-2">
                <span class="text-xs text-slate-400">Bal:</span>
                <span class="text-yellow-400 font-black text-sm">₹<span id="live-bal">51.00</span></span>
            </div>
        </div>

        <!-- REAL GRAPHICS SLOT MACHINE BOX -->
        <div class="bg-gradient-to-b from-slate-900 to-emerald-950 p-5 rounded-3xl casino-gold mb-6 text-center shadow-2xl">
            <h2 class="text-lg font-black text-yellow-300 mb-3 tracking-wide">🔥 ROYAL 777 SLOT ENGINE</h2>
            
            <div class="bg-black/80 p-4 rounded-2xl border border-yellow-500 flex justify-center gap-4 text-4xl mb-4 shadow-inner">
                <span id="slot-1" class="p-3 bg-slate-900 rounded-xl border border-emerald-500/30">🍒</span>
                <span id="slot-2" class="p-3 bg-slate-900 rounded-xl border border-emerald-500/30">🍋</span>
                <span id="slot-3" class="p-3 bg-slate-900 rounded-xl border border-emerald-500/30">💎</span>
            </div>

            <button onclick="triggerRealSpin()" class="w-full bg-gradient-to-r from-yellow-500 via-amber-400 to-yellow-500 text-slate-950 font-black py-3.5 rounded-xl shadow-lg text-sm tracking-wider uppercase cursor-pointer hover:scale-[1.02] active:scale-95 transition-transform">
                SPIN & WIN (₹10)
            </button>
            <p id="spin-status" class="mt-3 text-xs font-bold text-yellow-400 h-5"></p>
        </div>

        <!-- QUICK DEPOSIT BUTTON -->
        <div onclick="addMoneyUPI()" class="bg-emerald-900/80 border border-emerald-500 p-3.5 rounded-2xl text-center cursor-pointer shadow-lg">
            <p class="text-xs font-black text-yellow-300">⚡ Instant UPI Deposit (Navi: 8819920722@naviaxis)</p>
        </div>
    </div>

    <script>
        let wallet = 51.00;

        function triggerRealSpin() {
            if(wallet < 10) {
                alert('Wallet me balance kam hai!');
                return;
            }
            wallet -= 10;
            updateUI();

            document.getElementById('spin-status').innerText = "🎰 Spinning...";
            
            let icons = ['🍒', '🍋', '💎', '⭐', '🔔', '7️⃣'];
            let count = 0;
            
            let interval = setInterval(() => {
                document.getElementById('slot-1').innerText = icons[Math.floor(Math.random() * icons.length)];
                document.getElementById('slot-2').innerText = icons[Math.floor(Math.random() * icons.length)];
                document.getElementById('slot-3').innerText = icons[Math.floor(Math.random() * icons.length)];
                count++;

                if(count > 15) {
                    clearInterval(interval);
                    let final1 = icons[Math.floor(Math.random() * icons.length)];
                    let final2 = icons[Math.floor(Math.random() * icons.length)];
                    let final3 = icons[Math.floor(Math.random() * icons.length)];

                    document.getElementById('slot-1').innerText = final1;
                    document.getElementById('slot-2').innerText = final2;
                    document.getElementById('slot-3').innerText = final3;

                    if(final1 === final2 && final2 === final3) {
                        let winAmt = 150;
                        wallet += winAmt;
                        document.getElementById('spin-status').innerText = `🎉 JACKPOT! Aapne ₹${winAmt} jeet liye!`;
                    } else {
                        document.getElementById('spin-status').innerText = `❌ Haar gaye, dobara koshish karein!`;
                    }
                    updateUI();
                }
            }, 100);
        }

        function updateUI() {
            document.getElementById('live-bal').innerText = wallet.toFixed(2);
        }

        function addMoneyUPI() {
            let amt = prompt("Kitna amount add karna hai? (Min ₹50)");
            if(amt && !isNaN(amt) && amt >= 50) {
                let utr = prompt(`Kripya 8819920722@naviaxis par ₹${amt} bhejkar 12-digit UTR yahan enter karein:`);
                if(utr && utr.length >= 8) {
                    wallet += Number(amt);
                    updateUI();
                    alert(`✅ ₹${amt} successfully wallet me add ho gaye!`);
                }
            }
        }
    </script>
</body>
</html>
